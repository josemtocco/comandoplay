name: Atualizar lista ComandoPlay

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar lista M3U
        run: python gerar_comandoplay.py

      - name: Commit se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p playlists
          git add playlists/comandoplay.m3u
          if git diff --staged --quiet; then
            echo "Nenhuma mudança."
          else
            git commit -m "Atualização automática lista VOD ComandoPlay $(date -u +%Y-%m-%d)"
            git push
          fi
